
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: serve
    profiles: ["llm"]
    networks:
      - ai-network

  ollama-init:
    image: ollama/ollama:latest
    container_name: ai-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_NAME=${OLLAMA_MODEL:-mistral-nemo}
    command: >
      sh -c "ollama list | awk 'NR>1 {print $1}' | grep -qx \"$$MODEL_NAME\" || ollama pull \"$$MODEL_NAME\""
    restart: "no"
    profiles: ["llm"]
    networks:
      - ai-network

  ai:
    build: .
    container_name: ai-narration
    environment:
      - AI_MOCK=${AI_MOCK:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    networks:
      - ai-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
        - ai-network

volumes:
  ollama_models:
    name: ollama_models

networks:
  ai-network:
    name: ai-network