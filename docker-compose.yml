services:
  # === BACKEND ===

  api:
    build: ./Backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    env_file: ./Backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: tourcompanion
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tourcompanion"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - ai-network

  celery-worker:
    build: ./Backend
    command: celery -A app.core.celery_app worker -Q narrative -l info --concurrency 1
    env_file: ./Backend/.env
    volumes:
      - ./Backend:/app
      - tts_edge_cache:/root/.cache/edge-tts
      - ./Backend/audio_files:/app/audio_files
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    build: ./Backend
    command: celery -A app.core.celery_app beat -l info
    env_file: ./Backend/.env
    volumes:
      - ./Backend:/app
    depends_on:
      redis:
        condition: service_healthy

  www:
    build:
      context: ./www
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    ports:
      - "80:80"
    depends_on:
      - api

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./Backend/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
    ports:
      - "8080:8080"  


# === AI ===

  minio:
    image: minio/minio:latest
    container_name: tourguide-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin12345
    volumes:
      - minio_data:/data
    networks:
      - ai-network

  ai:
    build: ./AI
    container_name: ai-narration
    env_file: ./AI/.env
    depends_on:
      - minio
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONUNBUFFERED=1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin12345
      - MINIO_BUCKET=poi-images
      - MINIO_SECURE=false

    volumes:
      - ./AI:/app
    networks:
      - ai-network


volumes:
  pgdata:
  pgdata_test:
  tts_edge_cache:
  ollama_models:
    name: ollama_models
  minio_data:

networks:
  ai-network:
    name: ai-network
