name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  JWT_SECRET_KEY: test-secret
  JWT_ALGORITHM: HS256
  GOOGLE_CLIENT_ID: test-google-client
  KEYCLOAK_SERVER_URL: http://localhost:8080
  KEYCLOAK_INTERNAL_URL: http://localhost:8080
  KEYCLOAK_REALM: tourguide
  KEYCLOAK_CLIENT_ID: web-client
  KEYCLOAK_CLIENT_SECRET: web-secret
  KEYCLOAK_REDIRECT_URI: http://localhost:8000/auth/keycloak/callback
  FRONTEND_URL: http://localhost:3000
  REDIS_URL: redis://localhost:6379/0
  TTS_PROVIDER: edge
  AI_MOCK: "True"

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/test_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r Backend/requirements.txt
      - name: Run backend unit tests
        working-directory: Backend
        run: pytest tests --ignore=tests/e2e

  ai-unit:
    name: AI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AI/requirements.txt
      - name: Install AI dependencies
        run: pip install -r AI/requirements.txt pytest
      - name: Run AI unit tests
        working-directory: AI
        run: pytest tests

  mobile-unit:
    name: Mobile unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        working-directory: Mobile/android
        run: chmod +x ./gradlew
      - name: Run Android JVM unit tests
        working-directory: Mobile/android
        run: ./gradlew testDevDebugUnitTest

  backend-e2e:
    name: Backend E2E smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start backend stack
        run: docker compose -f docker-compose.ci.yml up -d --build api ai
      - name: Wait for backend API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.ci.yml logs api ai
          exit 1
      - name: Run E2E smoke tests
        run: docker compose -f docker-compose.ci.yml exec -T -e E2E_TESTS=1 api pytest tests/e2e
      - name: Stop backend stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans

  security-bandit:
    name: Static security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r Backend AI -x "*/tests/*" --severity-level medium

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r Backend/requirements.txt
          pip-audit -r AI/requirements.txt

  performance-smoke:
    name: Backend performance smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start backend stack
        run: docker compose -f docker-compose.ci.yml up -d --build api ai
      - name: Wait for backend API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.ci.yml logs api ai
          exit 1
      - name: Run Locust smoke test
        run: docker compose -f docker-compose.ci.yml run --rm locust
      - name: Stop backend stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans
